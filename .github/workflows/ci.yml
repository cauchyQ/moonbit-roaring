name: CI

on:
  push:
  pull_request:

jobs:
  check-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- '0.10.19+bee578715'
      - name: Add MoonBit to PATH
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Update MoonBit registry
        run: moon update
      - name: Check
        run: moon check --deny-warn
      - name: Test
        run: moon test --deny-warn
      - name: Test release
        run: moon test --release --deny-warn
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify CRoaring interoperability
        run: |
          python -m pip install pyroaring==1.2.0
          python verify_croaring.py
      - name: Build release artifact
        run: moon build --release --deny-warn
      - name: Check generated interfaces and formatting
        run: |
          moon info
          moon fmt
          git diff --exit-code
